<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クエストの色とアイコン（開発用）</title>
<link rel="stylesheet" href="../public/style.css">
<style>
  body { position: static; overflow: auto; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-soft); text-align: center; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs></defs></svg>
<h1>クエストの色とアイコン</h1>
<h2>色</h2>
<div class="swatches" id="colors"></div>
<h2>アイコン</h2>
<div class="grid" id="icons"></div>
<script src="../public/icons.js"></script>
<script>
  injectCategoryIcons();
  document.getElementById('colors').innerHTML = CATEGORY_COLORS.map((c) =>
    `<div class="cell"><span class="cat-icon cat-icon--lg" style="--cat-color:${c.hex}"><svg class="icon"><use href="#c-star"/></svg></span>${c.name}<br>${c.id}</div>`).join('');
  document.getElementById('icons').innerHTML = CATEGORY_ICONS.map(([id, label], i) => {
    const c = CATEGORY_COLORS[i % CATEGORY_COLORS.length];
    return `<div class="cell"><span class="cat-icon cat-icon--lg" style="--cat-color:${c.hex}"><svg class="icon"><use href="#c-${id}"/></svg></span>${label}<br>${id}</div>`;
  }).join('');
</script>
</body>
</html>
